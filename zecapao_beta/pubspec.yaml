name: zecapao_beta
description: Ze Capao Delivery MVP 0.3.3
publish_to: 'none'
version: 0.3.3+15

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.15.4
  google_fonts: ^6.2.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  video_player: ^2.10.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - Ativos/Marca/
    - Ativos/Marca/zecafe_products/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: Ativos/Marca/zecapao_app_icon.png
  adaptive_icon_background: '#F4E8D3'
  adaptive_icon_foreground: Ativos/Marca/zecapao_app_icon.png
