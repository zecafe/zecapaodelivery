name: zecapao_beta
description: Zecapao Delivery Beta 0.3 Branding
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - Ativos/Marca/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: Ativos/Marca/zecapao_app_icon.png
  adaptive_icon_background: '#E2231A'
  adaptive_icon_foreground: Ativos/Marca/zecapao_app_icon.png
