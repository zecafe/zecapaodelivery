name: zecapao_beta
description: Ze Capao Delivery Foundation 1.0
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.15.4
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - Ativos/Marca/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: Ativos/Marca/zecapao_app_icon.png
  adaptive_icon_background: '#F4E8D3'
  adaptive_icon_foreground: Ativos/Marca/zecapao_app_icon.png
