name: Ze Entregador MVP APK
on:
  workflow_dispatch:
  push:
    branches: [feat/ze-entregador-mvp]
    paths:
      - 'zecapao_entregador/**'
      - '.github/workflows/ze-entregador-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Create Android project and build
        run: |
          flutter create /tmp/ze_entregador --platforms=android --org com.zecapao --project-name ze_entregador
          cp zecapao_entregador/pubspec.yaml /tmp/ze_entregador/pubspec.yaml
          cp zecapao_entregador/lib/main.dart /tmp/ze_entregador/lib/main.dart
          cp zecapao_entregador/assets/branding/entregador_icon.png /tmp/entregador_icon.png
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "/tmp/ze_entregador/android/app/src/main/res/mipmap-$density"
            convert /tmp/entregador_icon.png -resize "${size}x${size}!" "/tmp/ze_entregador/android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          cd /tmp/ze_entregador
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ze-entregador-mvp-apk
          path: /tmp/ze_entregador/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
