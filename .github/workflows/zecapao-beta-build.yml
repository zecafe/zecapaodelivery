name: Zecapao Foundation APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zecapao_beta/**'
      - '.github/workflows/zecapao-beta-build.yml'

jobs:
  build-foundation-apk:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zecapao-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Zecapao,C=BR"
          fi
          echo '=== ZECAPAO MAPS ANDROID ID ==='
          echo 'com.zecapao.entrega'
          echo '=== ZECAPAO DEBUG SHA1 ==='
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA1:'

      - name: Validate SAFE branding
        shell: bash
        run: |
          test -f zecapao_beta/Ativos/Marca/zecapao_app_icon.png.png || { echo 'ERRO: novo PNG oficial ausente'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('zecapao_beta/Ativos/Marca/zecapao_app_icon.png.png')
          sig=p.read_bytes()[:8]
          if sig != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('ERRO: arquivo enviado nao possui assinatura PNG valida')
          print('PNG oficial valido:', p, p.stat().st_size, 'bytes')
          PY

      - name: Create clean Android project
        run: |
          rm -rf /tmp/zecapao_build
          flutter create /tmp/zecapao_build --platforms=android --org com.zecapao --project-name zecapao_delivery

      - name: Apply complete MVP source and SAFE branding
        shell: bash
        run: |
          cp zecapao_beta/pubspec.yaml /tmp/zecapao_build/pubspec.yaml
          rm -rf /tmp/zecapao_build/lib
          cp -R zecapao_beta/lib /tmp/zecapao_build/lib
          mkdir -p /tmp/zecapao_build/Ativos/Marca
          cp -R zecapao_beta/Ativos/Marca/. /tmp/zecapao_build/Ativos/Marca/
          cp zecapao_beta/Ativos/Marca/zecapao_app_icon.png.png /tmp/zecapao_build/Ativos/Marca/zecapao_app_icon.png
          rm -rf /tmp/zecapao_build/test
          echo '=== ICON USED BY BUILD ==='
          file /tmp/zecapao_build/Ativos/Marca/zecapao_app_icon.png

      - name: Configure Android identity, MainActivity and Maps
        working-directory: /tmp/zecapao_build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          key = os.environ.get('GOOGLE_MAPS_API_KEY') or 'MISSING_MAPS_KEY'
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace(marker, marker + '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />', 1)
          if 'com.google.android.geo.API_KEY' not in text:
              app_icon = 'android:icon="@mipmap/ic_launcher">'
              metadata = app_icon + f'\n        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />'
              if app_icon not in text:
                  raise SystemExit('Nao encontrei a tag application para inserir Maps API key.')
              text = text.replace(app_icon, metadata, 1)
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          g = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.zecapao.entrega"', g)
          g = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.zecapao.entrega"', g)
          gradle.write_text(g)

          candidates = list(Path('android/app/src/main').rglob('MainActivity.kt'))
          if not candidates:
              raise SystemExit('MainActivity.kt nao encontrada no projeto Android gerado')
          src = candidates[0]
          main = src.read_text()
          main = re.sub(r'^package\s+[^\n]+', 'package com.zecapao.entrega', main, flags=re.M)
          dst = Path('android/app/src/main/kotlin/com/zecapao/entrega/MainActivity.kt')
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(main)
          if src.resolve() != dst.resolve():
              src.unlink()
          print('MainActivity alinhada:', dst)
          print(dst.read_text())
          PY
          echo '=== ANDROID PACKAGE CHECK ==='
          grep -E 'namespace|applicationId' android/app/build.gradle.kts
          echo '=== MAIN ACTIVITY CHECK ==='
          grep -R '^package com.zecapao.entrega' android/app/src/main/kotlin/com/zecapao/entrega/MainActivity.kt
          test -n "$GOOGLE_MAPS_API_KEY" || { echo 'GOOGLE_MAPS_API_KEY ausente'; exit 1; }

      - name: Install dependencies
        working-directory: /tmp/zecapao_build
        run: flutter pub get

      - name: Generate SAFE Android launcher icon
        working-directory: /tmp/zecapao_build
        run: dart run flutter_launcher_icons

      - name: Analyze MVP source
        working-directory: /tmp/zecapao_build
        run: flutter analyze lib/main_catalog.dart lib/catalog --no-fatal-infos --no-fatal-warnings

      - name: Build MVP APK
        working-directory: /tmp/zecapao_build
        run: flutter build apk --debug --target=lib/main_catalog.dart

      - name: Upload MVP APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-1.9.5-safe-mainactivity-fix-apk
          path: /tmp/zecapao_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
