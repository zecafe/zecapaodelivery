name: Zecapao Foundation APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zecapao_beta/**'
      - '.github/assets/branding_official.zip.b64'
      - '.github/workflows/zecapao-beta-build.yml'

jobs:
  build-foundation-apk:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zecapao-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Zecapao,C=BR"
          fi
          echo '=== ZECAPAO MAPS ANDROID ID ==='
          echo 'com.zecapao.entrega'
          echo '=== ZECAPAO DEBUG SHA1 ==='
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA1:'

      - name: Discover existing partner branding assets
        id: branding
        shell: bash
        run: |
          ICON_PATH="$(find zecapao_beta -type f -name 'zecapao_app_icon.png' | head -n 1)"
          if [ -z "$ICON_PATH" ]; then
            echo 'ERRO: zecapao_app_icon.png nao foi encontrado.'
            exit 1
          fi
          BRAND_DIR="$(dirname "$ICON_PATH")"
          test -f "$BRAND_DIR/zecafe.jpg" || { echo 'ERRO: zecafe.jpg ausente.'; exit 1; }
          echo "brand_dir=$BRAND_DIR" >> "$GITHUB_OUTPUT"

      - name: Create clean Android project
        run: |
          rm -rf /tmp/zecapao_build
          flutter create /tmp/zecapao_build --platforms=android --org com.zecapao --project-name zecapao_delivery

      - name: Apply complete MVP source and existing partner branding
        shell: bash
        run: |
          cp zecapao_beta/pubspec.yaml /tmp/zecapao_build/pubspec.yaml
          rm -rf /tmp/zecapao_build/lib
          cp -R zecapao_beta/lib /tmp/zecapao_build/lib
          mkdir -p /tmp/zecapao_build/Ativos/Marca
          cp -R "${{ steps.branding.outputs.brand_dir }}/." /tmp/zecapao_build/Ativos/Marca/
          rm -rf /tmp/zecapao_build/test

      - name: Install official Ze Capao branding
        shell: bash
        run: |
          rm -rf /tmp/zecapao_branding
          mkdir -p /tmp/zecapao_branding/files
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile, shutil

          source = Path('.github/assets/branding_official.zip.b64')
          raw = ''.join(source.read_text().split())
          try:
              payload = base64.b64decode(raw, validate=False)
          except Exception as exc:
              raise SystemExit(f'Falha ao decodificar branding base64: {exc}')

          print(f'Branding ZIP reconstruido: {len(payload)} bytes')
          try:
              zf = zipfile.ZipFile(io.BytesIO(payload))
              names = zf.namelist()
              print('Arquivos no pacote:', names)
              zf.extractall('/tmp/zecapao_branding/files')
          except Exception as exc:
              raise SystemExit(f'Falha ao abrir ZIP de branding: {exc}')

          root = Path('/tmp/zecapao_branding/files')
          target = Path('/tmp/zecapao_build/Ativos/Marca')
          wanted = {
              'icon.png': 'zecapao_app_icon.png',
              'logo.webp': 'zecapao_logo_horizontal.webp',
              'mascote.webp': 'zecapao_mascote.webp',
              'splash.webp': 'zecapao_splash.webp',
          }
          for src_name, dst_name in wanted.items():
              src = root / src_name
              if not src.exists():
                  raise SystemExit(f'Arquivo oficial ausente no pacote: {src_name}')
              shutil.copy2(src, target / dst_name)
              print(f'OK {src_name} -> {dst_name} ({src.stat().st_size} bytes)')
          PY
          echo '=== OFFICIAL BRANDING INSTALLED ==='
          ls -lh /tmp/zecapao_build/Ativos/Marca/zecapao_*

      - name: Configure Android identity and Maps
        working-directory: /tmp/zecapao_build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          key = os.environ.get('GOOGLE_MAPS_API_KEY') or 'MISSING_MAPS_KEY'
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace(marker, marker + '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />', 1)
          if 'com.google.android.geo.API_KEY' not in text:
              app_icon = 'android:icon="@mipmap/ic_launcher">'
              metadata = app_icon + f'\n        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />'
              if app_icon not in text:
                  raise SystemExit('Nao encontrei a tag application para inserir Maps API key.')
              text = text.replace(app_icon, metadata, 1)
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          g = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.zecapao.entrega"', g)
          g = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.zecapao.entrega"', g)
          gradle.write_text(g)
          PY

          echo '=== ANDROID PACKAGE CHECK ==='
          grep -E 'namespace|applicationId' android/app/build.gradle.kts
          test "$GOOGLE_MAPS_API_KEY" != "" || { echo 'GOOGLE_MAPS_API_KEY ausente'; exit 1; }

      - name: Install dependencies
        working-directory: /tmp/zecapao_build
        run: flutter pub get

      - name: Generate official Android launcher icon
        working-directory: /tmp/zecapao_build
        run: dart run flutter_launcher_icons

      - name: Analyze MVP source
        working-directory: /tmp/zecapao_build
        run: flutter analyze lib/main_catalog.dart lib/catalog --no-fatal-infos --no-fatal-warnings

      - name: Build MVP APK
        working-directory: /tmp/zecapao_build
        run: flutter build apk --debug --target=lib/main_catalog.dart

      - name: Upload MVP APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-1.9.4-branding-oficial-apk
          path: /tmp/zecapao_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
