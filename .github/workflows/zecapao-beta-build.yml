name: Zecapao Dynamic Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zecapao_beta/**'
      - '.github/workflows/zecapao-beta-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zecapao-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Zecapao,C=BR"
          fi

      - name: Create clean Android project and restore premium Home
        run: |
          rm -rf /tmp/zecapao_build
          flutter create /tmp/zecapao_build --platforms=android --org com.zecapao --project-name zecapao_delivery
          cp zecapao_beta/pubspec.yaml /tmp/zecapao_build/pubspec.yaml
          rm -rf /tmp/zecapao_build/lib
          cp -R zecapao_beta/lib /tmp/zecapao_build/lib
          mkdir -p /tmp/zecapao_build/Ativos/Marca
          cp -R zecapao_beta/Ativos/Marca/. /tmp/zecapao_build/Ativos/Marca/
          cp zecapao_beta/Ativos/Marca/zecapao_app_icon.png.png /tmp/zecapao_build/Ativos/Marca/zecapao_app_icon.png
          rm -rf /tmp/zecapao_build/test
          git fetch --depth=1 origin 02ebafe4570fb1334a15626671cd515cb60cd317
          git show 02ebafe4570fb1334a15626671cd515cb60cd317:zecapao_beta/lib/catalog/showcase_home.dart > /tmp/zecapao_build/lib/catalog/showcase_home.dart
          echo "Home premium histórica restaurada como base do 0.3.2"

      - name: Apply 0.3.2 final circuit
        working-directory: /tmp/zecapao_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/catalog/showcase_home.dart')
          s=p.read_text()
          if "import 'category_hub.dart';" not in s:
              s=s.replace("import 'branded_store.dart';", "import 'branded_store.dart';\nimport 'category_hub.dart';", 1)
          if 'Future<void> openCategory(String category)' not in s:
              marker='  @override\n  Widget build(BuildContext context) {'
              method="""  Future<void> openCategory(String category) async {\n    await Navigator.push(context, MaterialPageRoute(builder: (_) => CategoryHubPage(category: category, customerName: widget.customerName, phone: widget.phone, repo: repo)));\n  }\n\n"""
              s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
          python3 "$GITHUB_WORKSPACE/zecapao_beta/tool/dynamic_media_patch.py"
          python3 "$GITHUB_WORKSPACE/zecapao_beta/tool/premium_home_patch.py"
          python3 "$GITHUB_WORKSPACE/zecapao_beta/tool/entry_dynamic_patch.py"
          python3 "$GITHUB_WORKSPACE/zecapao_beta/tool/final_app_patch.py"
          python3 "$GITHUB_WORKSPACE/zecapao_beta/tool/checkout_location_patch.py"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/catalog/showcase_home.dart')
          s=p.read_text()
          s=s.replace('          _occasionRail(),\n','')
          start=s.find('  Widget _occasionRail()')
          end=s.find('  Widget _valecoin()',start)
          if start!=-1 and end!=-1:
              s=s[:start]+s[end:]
          p.write_text(s)
          print('Home premium consolidada sem bloco legado malformado')
          PY
          echo "0.3.2: entrada + hospedagem premium + checkout/mapa com assinatura estável"

      - name: Configure Android identity and Maps
        working-directory: /tmp/zecapao_build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'ACCESS_FINE_LOCATION' not in text:
              text=text.replace(marker,marker+'\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',1)
          key=os.environ.get('GOOGLE_MAPS_API_KEY','')
          app_icon='android:icon="@mipmap/ic_launcher">'
          if 'com.google.android.geo.API_KEY' not in text:
              text=text.replace(app_icon,app_icon+f'\n        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />',1)
          manifest.write_text(text)
          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          g=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.zecapao.entrega"',g)
          g=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.zecapao.entrega"',g)
          gradle.write_text(g)
          src=list(Path('android/app/src/main').rglob('MainActivity.kt'))[0]
          main=re.sub(r'^package\s+[^\n]+','package com.zecapao.entrega',src.read_text(),flags=re.M)
          dst=Path('android/app/src/main/kotlin/com/zecapao/entrega/MainActivity.kt')
          dst.parent.mkdir(parents=True,exist_ok=True); dst.write_text(main)
          if src.resolve()!=dst.resolve(): src.unlink()
          PY
          test -n "$GOOGLE_MAPS_API_KEY" || { echo 'GOOGLE_MAPS_API_KEY ausente'; exit 1; }

      - name: Build APK
        working-directory: /tmp/zecapao_build
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart format lib/catalog
          flutter analyze lib/main_catalog.dart lib/catalog --no-fatal-infos --no-fatal-warnings
          flutter build apk --debug --target=lib/main_catalog.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-0.3.2-final-fixes-apk
          path: /tmp/zecapao_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
