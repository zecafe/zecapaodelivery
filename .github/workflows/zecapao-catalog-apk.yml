name: Zecapao Catalog APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zecapao_beta/lib/catalog/**'
      - 'zecapao_beta/lib/main_catalog.dart'
      - 'zecapao_beta/pubspec.yaml'
      - 'zecapao_beta/Ativos/Marca/**'
      - '.github/workflows/zecapao-catalog-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zecapao-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Zecapao,C=BR"
          fi

      - name: Restore Android project
        working-directory: zecapao_beta
        run: flutter create --platforms=android --org com.zecapao --project-name zecapao_delivery .

      - name: Configure Android identity and Maps
        working-directory: zecapao_beta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          key=(os.environ.get('GOOGLE_MAPS_API_KEY') or '').strip()
          if not key: raise SystemExit('GOOGLE_MAPS_API_KEY nao configurada nos Secrets do repositorio.')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text=text.replace(marker,marker+'\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',1)
          if 'com.google.android.geo.API_KEY' not in text:
              app_icon='android:icon="@mipmap/ic_launcher">'
              text=text.replace(app_icon,app_icon+f'\n        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />',1)
          manifest.write_text(text)
          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          g=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.zecapao.entrega"',g)
          g=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.zecapao.entrega"',g)
          gradle.write_text(g)
          candidates=list(Path('android/app/src/main').rglob('MainActivity.kt'))
          if not candidates: raise SystemExit('MainActivity.kt nao encontrada')
          src=candidates[0]
          main=re.sub(r'^package\s+[^\n]+','package com.zecapao.entrega',src.read_text(),flags=re.M)
          dst=Path('android/app/src/main/kotlin/com/zecapao/entrega/MainActivity.kt')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(main)
          if src.resolve()!=dst.resolve(): src.unlink()
          PY

      - name: Dependencies
        working-directory: zecapao_beta
        run: flutter pub get

      - name: Validate essential branding
        working-directory: zecapao_beta
        run: |
          test -s Ativos/Marca/zecapao_app_icon.png
          test -s Ativos/Marca/zecafe_logo_oficial.jpg
          test -s Ativos/Marca/zecafe_products/espresso.webp

      - name: Generate Android launcher icons
        working-directory: zecapao_beta
        run: dart run flutter_launcher_icons

      - name: Repair showcase occasion rail syntax
        working-directory: zecapao_beta
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/catalog/showcase_home.dart')
          s=p.read_text()
          old='''return SizedBox(height: 150, child: ListView.separated(scrollDirection: Axis.horizontal, itemCount: items.length, separatorBuilder: (_, __) => const SizedBox(width: 11), itemBuilder: (_, i) { final x = items[i]; return Container(width: 222, clipBehavior: Clip.antiAlias, decoration: BoxDecoration(gradient: LinearGradient(colors: x.$4), borderRadius: BorderRadius.circular(25)), child: Stack(children: [Positioned(right: -3, bottom: -3, child: Icon(x.$3, size: 88, color: Colors.white.withValues(alpha: .88))), Positioned(right: -30, top: -35, child: Container(width: 115, height: 115, decoration: BoxDecoration(color: Colors.white.withValues(alpha: .08), shape: BoxShape.circle))), Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.center, children: [SizedBox(width: 145, child: Text(x.$1, style: const TextStyle(color: Colors.white, fontSize: 18, height: 1.05, fontWeight: FontWeight.w900))), const SizedBox(height: 7), SizedBox(width: 125, child: Text(x.$2, style: const TextStyle(color: Colors.white70, fontSize: 10.5, height: 1.25)))])]))); }));'''
          new='''return SizedBox(height: 150, child: ListView.separated(scrollDirection: Axis.horizontal, itemCount: items.length, separatorBuilder: (_, __) => const SizedBox(width: 11), itemBuilder: (_, i) { final x = items[i]; return Container(width: 222, clipBehavior: Clip.antiAlias, decoration: BoxDecoration(gradient: LinearGradient(colors: x.$4), borderRadius: BorderRadius.circular(25)), child: Stack(children: [Positioned(right: -3, bottom: -3, child: Icon(x.$3, size: 88, color: Colors.white.withValues(alpha: .88))), Positioned(right: -30, top: -35, child: Container(width: 115, height: 115, decoration: BoxDecoration(color: Colors.white.withValues(alpha: .08), shape: BoxShape.circle))), Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.center, children: [SizedBox(width: 145, child: Text(x.$1, style: const TextStyle(color: Colors.white, fontSize: 18, height: 1.05, fontWeight: FontWeight.w900))), const SizedBox(height: 7), SizedBox(width: 125, child: Text(x.$2, style: const TextStyle(color: Colors.white70, fontSize: 10.5, height: 1.25)))]))])); }));'''
          if old not in s: raise SystemExit('Trecho esperado do occasion rail nao encontrado')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Apply MVP 0.2.6 navigation rules
        working-directory: zecapao_beta
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/catalog/showcase_home.dart')
          s=p.read_text()

          if "import 'hospedagens_page.dart';" not in s:
              marker="import 'branded_store.dart';"
              if marker not in s: raise SystemExit('Import marker not found')
              s=s.replace(marker, marker+"\nimport 'hospedagens_page.dart';",1)

          old="""          Container(\n            height: 58,\n            decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(19), boxShadow: const [BoxShadow(color: Color(0x10000000), blurRadius: 18, offset: Offset(0, 7))]),\n            child: const Row(children: [SizedBox(width: 18), Icon(Icons.search_rounded, size: 28), SizedBox(width: 14), Expanded(child: Text('O que você procura no Vale?', style: TextStyle(color: brandMuted, fontSize: 16)))]),\n          ),"""
          new="""          InkWell(\n            onTap: () => setState(() => tab = 1),\n            borderRadius: BorderRadius.circular(19),\n            child: Container(\n              height: 58,\n              decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(19), boxShadow: const [BoxShadow(color: Color(0x10000000), blurRadius: 18, offset: Offset(0, 7))]),\n              child: const Row(children: [SizedBox(width: 18), Icon(Icons.search_rounded, size: 28), SizedBox(width: 14), Expanded(child: Text('O que você procura no Vale?', style: TextStyle(color: brandMuted, fontSize: 16)))]),\n            ),\n          ),"""
          if old not in s: raise SystemExit('Search box marker not found')
          s=s.replace(old,new,1)

          old="TextButton(onPressed: () {}, child: const Text('Ver agenda'))"
          new="TextButton(onPressed: () => setState(() => tab = 3), child: const Text('Ver agenda'))"
          if old not in s: raise SystemExit('Agenda marker not found')
          s=s.replace(old,new,1)

          old="return SizedBox(width: 76, child: Column(children: ["
          new="return InkWell(onTap: () { if (i == 4) { Navigator.push(context, MaterialPageRoute(builder: (_) => const HospedagensPage())); } else { setState(() => tab = 1); } }, borderRadius: BorderRadius.circular(23), child: SizedBox(width: 76, child: Column(children: ["
          if old not in s: raise SystemExit('Category tile marker not found')
          s=s.replace(old,new,1)

          old="      ]));\n    }));\n  }\n\n  Widget _zecafeHero"
          new="      ])));\n    }));\n  }\n\n  Widget _zecafeHero"
          if old not in s: raise SystemExit('Category closing marker not found')
          s=s.replace(old,new,1)

          s=s.replace("const Center(child: Text('MVP 0.2.3 • SHOWCASE'", "const Center(child: Text('MVP 0.2.6 • PREMIUM'",1)
          p.write_text(s)
          PY
          dart format lib/catalog/showcase_home.dart lib/catalog/hospedagens_page.dart lib/catalog/showcase_shell.dart

      - name: Validate navigation contract
        working-directory: zecapao_beta
        run: |
          grep -q "HospedagensPage" lib/catalog/showcase_home.dart
          grep -q "tab = 1" lib/catalog/showcase_home.dart
          grep -q "tab = 3" lib/catalog/showcase_home.dart
          ! grep -q "POUSADA DEMO" lib/catalog/showcase_shell.dart
          grep -q "FAZER RESERVA" lib/catalog/pousada_demo.dart
          echo 'Contrato minimo de navegacao validado.'

      - name: Analyze catalog
        working-directory: zecapao_beta
        run: flutter analyze lib/main_catalog.dart lib/catalog --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: zecapao_beta
        run: flutter build apk --debug --target=lib/main_catalog.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-mvp-0.2.6-premium-navigation-apk
          path: zecapao_beta/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14