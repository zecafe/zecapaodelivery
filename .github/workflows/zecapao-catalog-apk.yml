name: Zecapao Catalog APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zecapao_beta/lib/catalog/**'
      - 'zecapao_beta/lib/main_catalog.dart'
      - 'zecapao_beta/pubspec.yaml'
      - 'zecapao_beta/Ativos/Marca/**'
      - '.github/workflows/zecapao-catalog-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zecapao-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Zecapao,C=BR"
          fi

      - name: Restore Android project
        working-directory: zecapao_beta
        run: flutter create --platforms=android --org com.zecapao --project-name zecapao_delivery .

      - name: Configure Android identity and Maps
        working-directory: zecapao_beta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          key=(os.environ.get('GOOGLE_MAPS_API_KEY') or '').strip()
          if not key: raise SystemExit('GOOGLE_MAPS_API_KEY nao configurada nos Secrets do repositorio.')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text=text.replace(marker,marker+'\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',1)
          if 'com.google.android.geo.API_KEY' not in text:
              app_icon='android:icon="@mipmap/ic_launcher">'
              text=text.replace(app_icon,app_icon+f'\n        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />',1)
          manifest.write_text(text)
          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          g=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.zecapao.entrega"',g)
          g=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.zecapao.entrega"',g)
          gradle.write_text(g)
          candidates=list(Path('android/app/src/main').rglob('MainActivity.kt'))
          if not candidates: raise SystemExit('MainActivity.kt nao encontrada')
          src=candidates[0]
          main=re.sub(r'^package\s+[^\n]+','package com.zecapao.entrega',src.read_text(),flags=re.M)
          dst=Path('android/app/src/main/kotlin/com/zecapao/entrega/MainActivity.kt')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(main)
          if src.resolve()!=dst.resolve(): src.unlink()
          PY

      - name: Dependencies
        working-directory: zecapao_beta
        run: flutter pub get

      - name: Validate essential branding
        working-directory: zecapao_beta
        run: |
          test -s Ativos/Marca/zecapao_app_icon.png
          test -s Ativos/Marca/zecafe_logo_oficial.jpg
          test -s Ativos/Marca/zecafe_products/espresso.webp

      - name: Generate Android launcher icons
        working-directory: zecapao_beta
        run: dart run flutter_launcher_icons

      - name: Analyze catalog
        working-directory: zecapao_beta
        run: flutter analyze lib/main_catalog.dart lib/catalog --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: zecapao_beta
        run: flutter build apk --debug --target=lib/main_catalog.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-mvp-0.2.5-showcase-pousada-stable-apk
          path: zecapao_beta/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14