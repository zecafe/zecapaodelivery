name: Zecapao Catalog APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zecapao_beta/lib/catalog/**'
      - 'zecapao_beta/lib/main_catalog.dart'
      - 'zecapao_beta/pubspec.yaml'
      - '.github/assets/zecapao_icon.xpm'
      - '.github/workflows/zecapao-catalog-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Restore Android project
        working-directory: zecapao_beta
        run: flutter create --platforms=android --project-name zecapao_beta .

      - name: Dependencies
        working-directory: zecapao_beta
        run: flutter pub get

      - name: Build official launcher source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p zecapao_beta/Ativos/Marca
          convert .github/assets/zecapao_icon.xpm -resize 512x512 zecapao_beta/Ativos/Marca/zecapao_app_icon.png

      - name: Generate Android launcher icons
        working-directory: zecapao_beta
        run: dart run flutter_launcher_icons

      - name: Analyze catalog
        working-directory: zecapao_beta
        run: flutter analyze lib/main_catalog.dart lib/catalog --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: zecapao_beta
        run: flutter build apk --debug --target=lib/main_catalog.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-catalog-1.4-full-experience-apk
          path: zecapao_beta/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
