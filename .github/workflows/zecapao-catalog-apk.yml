name: Zecapao Catalog APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zecapao_beta/lib/catalog/**'
      - 'zecapao_beta/lib/main_catalog.dart'
      - 'zecapao_beta/pubspec.yaml'
      - '.github/assets/zecapao_icon.xpm'
      - '.github/workflows/zecapao-catalog-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Restore Android project
        working-directory: zecapao_beta
        run: flutter create --platforms=android --project-name zecapao_beta .

      - name: Configure Android Maps
        working-directory: zecapao_beta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          key = os.environ.get('GOOGLE_MAPS_API_KEY') or 'MISSING_MAPS_KEY'
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace(marker, marker + '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />', 1)
          if 'com.google.android.geo.API_KEY' not in text:
              app_icon = 'android:icon="@mipmap/ic_launcher">'
              metadata = app_icon + f'\n        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />'
              if app_icon not in text:
                  raise SystemExit('Nao encontrei a tag application para inserir Maps API key.')
              text = text.replace(app_icon, metadata, 1)
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(g)
          PY

      - name: Dependencies
        working-directory: zecapao_beta
        run: flutter pub get

      - name: Build launcher source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p zecapao_beta/Ativos/Marca
          convert .github/assets/zecapao_icon.xpm -resize 512x512 zecapao_beta/Ativos/Marca/zecapao_app_icon.png

      - name: Generate Android launcher icons
        working-directory: zecapao_beta
        run: dart run flutter_launcher_icons

      - name: Analyze catalog
        working-directory: zecapao_beta
        run: flutter analyze lib/main_catalog.dart lib/catalog --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: zecapao_beta
        run: flutter build apk --debug --target=lib/main_catalog.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-catalog-1.9-mvp-comercial-apk
          path: zecapao_beta/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
