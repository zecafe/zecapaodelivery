name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'zecafe/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zecafe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Flutter entrypoint
        run: |
          echo "Commit em build: $GITHUB_SHA"
          pwd
          ls -la
          test -f lib/main.dart
          echo "lib/main.dart encontrado"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug -t lib/main.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-debug-apk
          path: zecafe/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
