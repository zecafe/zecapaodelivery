name: Deploy Zecapao Web Panels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'partner/**'
      - '.github/workflows/admin-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble web panels
        run: |
          rm -rf _site
          mkdir -p _site/parceiro
          cp -R admin/. _site/
          cp -R partner/. _site/parceiro/
          echo '=== SITE ==='
          find _site -maxdepth 3 -type f | sort

      - name: Upload web panels
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
