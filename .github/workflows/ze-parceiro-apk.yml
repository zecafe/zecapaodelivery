name: Ze Parceiro APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ze-entregador-mvp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Criar projeto Android
        run: |
          flutter create --platforms=android --org com.zecapao /tmp/ze_parceiro
          cp zecapao_parceiro/pubspec.yaml /tmp/ze_parceiro/pubspec.yaml
          cp zecapao_parceiro/lib/main.dart /tmp/ze_parceiro/lib/main.dart
      - name: Dependencias
        working-directory: /tmp/ze_parceiro
        run: flutter pub get
      - name: Build APK
        working-directory: /tmp/ze_parceiro
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ze-parceiro-apk
          path: /tmp/ze_parceiro/build/app/outputs/flutter-apk/app-debug.apk
