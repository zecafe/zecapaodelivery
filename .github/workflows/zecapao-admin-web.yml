name: Zecapao Admin Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zecapao_admin/**'
      - '.github/workflows/zecapao-admin-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: zecapao_admin/package-lock.json
      - name: Install
        working-directory: zecapao_admin
        run: npm install
      - name: Build
        working-directory: zecapao_admin
        run: npm run build
      - name: Upload Admin Web
        uses: actions/upload-artifact@v4
        with:
          name: zecapao-admin-v0.1-web
          path: zecapao_admin/dist
          retention-days: 14
