<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primeiro acesso • Zé Capão Parceiro</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><section class="center"><form id="onboard" class="card login-card"><div class="brand">ZC</div><small>PRIMEIRO ACESSO</small><h1>Painel do Parceiro</h1><p>Digite o mesmo e-mail que foi convidado pelo administrador. Você receberá um link seguro para entrar.</p><label>E-mail convidado<input id="email" type="email" required></label><button type="submit">Enviar link de acesso</button><a href="./" class="outline" style="text-align:center;text-decoration:none">Já tenho acesso</a><div id="message" class="error"></div></form></section><script>const sb=window.supabase.createClient('https://yovjbqtazkreruvxoawf.supabase.co','sb_publishable_qOQlqYHbhc1005WoMOZS6g__52vXAor');document.getElementById('onboard').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();const msg=document.getElementById('message');msg.textContent='Enviando...';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:new URL('./',location.href).href,shouldCreateUser:true}});if(error){msg.textContent=error.message||'Não foi possível enviar o acesso.';return}msg.style.color='#1F5E3A';msg.textContent='Link enviado. Confira seu e-mail e abra o acesso neste dispositivo.';});</script></body></html>
